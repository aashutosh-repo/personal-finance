<app-header [menuOpen]="isMobileNavOpen" (menuToggle)="toggleMobileNav()"></app-header>

<div class="layout-container" [class.sidebar-collapsed]="isSidebarCollapsed">
    <button *ngIf="isMobileNavOpen" class="mobile-nav-backdrop" type="button"
      aria-label="Close navigation" (click)="closeMobileNav()"></button>
    <aside class="sidebar-container" [class.mobile-nav-open]="isMobileNavOpen">
    <app-sidebar
      [isCollapsed]="isSidebarCollapsed"
      (collapsedChange)="isSidebarCollapsed = $event"
      (menuSelect)="onMenuSelect($event)"
    ></app-sidebar>
  </aside>

  <main class="main-content">
    <router-outlet></router-outlet>
  </main>
</div>

<app-footer></app-footer>
