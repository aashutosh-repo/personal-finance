<div class="chatbot-container">
  <mat-card class="chatbot-card">
    <mat-card-header>
      <mat-card-title>Financial Advisor AI Chat</mat-card-title>
      <button mat-icon-button (click)="clearChat()" class="clear-btn" matTooltip="Clear chat">
        <mat-icon>delete</mat-icon>
      </button>
    </mat-card-header>

    <mat-card-content class="chat-messages" #messagesContainer>
      <div *ngFor="let message of messages; trackBy: trackByTimestamp" 
           [ngClass]="{'user-message': message.role === 'user', 'assistant-message': message.role === 'assistant'}"
           class="message">
        <div class="message-avatar">
          <mat-icon *ngIf="message.role === 'user'">account_circle</mat-icon>
          <mat-icon *ngIf="message.role === 'assistant'">smart_toy</mat-icon>
        </div>
        <div class="message-content">
          <div class="message-text" [innerHTML]="formatMessageContent(message.content)"></div>
          <span class="message-time">{{ message.timestamp | date: 'short' }}</span>
        </div>
      </div>

      <div *ngIf="isLoading" class="loading-indicator">
        <mat-spinner [diameter]="30"></mat-spinner>
        <p>Thinking...</p>
      </div>
    </mat-card-content>

    <mat-card-footer class="chat-input">
      <form [formGroup]="chatForm" (ngSubmit)="sendMessage()" class="input-form">
        <mat-form-field appearance="outline" class="message-field">
          <mat-label>Type your message...</mat-label>
          <input matInput formControlName="message" placeholder="Ask me about your finances..." [disabled]="isLoading" />
        </mat-form-field>
        <button 
          mat-fab 
          color="primary" 
          [disabled]="!chatForm.valid || isLoading"
          matTooltip="Send message"
          type="submit">
          <mat-icon>send</mat-icon>
        </button>
      </form>
    </mat-card-footer>
  </mat-card>
</div>
