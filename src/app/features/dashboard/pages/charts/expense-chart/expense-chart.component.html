<div class="chart-section">
  <div class="chart-header" *ngIf="periodLabel">
    <span class="chart-label">{{ periodLabel }}</span>
  </div>

  <div *ngIf="isBrowser && hasData" class="chart-wrapper">
    <canvas
      baseChart
      [data]="chartConfig"
      [options]="chartOptions"
      chartType="bar">
    </canvas>
  </div>

  <div *ngIf="isBrowser && !hasData" class="empty-state-card" aria-live="polite">
    <div class="empty-state-icon" aria-hidden="true">📊</div>
    <h4>No cash flow data yet</h4>
    <p>Add income or expenses to see your cash flow.</p>
    <a class="empty-state-action" routerLink="/v1/transactions">Add Transaction</a>
  </div>
</div>
